<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Collage console</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/console.css">
</head>
<body>
<canvas id="canvas"></canvas>
<button id="toggle" type="button">Hide panel</button>

<aside id="panel">
  <div id="msg"></div>

  <h2>Add images</h2>
  <label id="drop" for="file">Tap or drop images here<br><span class="hint">PNG, JPEG, HEIC, GIF</span></label>
  <input id="file" class="sr" type="file" accept="image/*" multiple>
  <div id="pasteZone" contenteditable="true">Tap here, then paste — for an iPhone cutout: hold on a subject in Photos, Copy, then paste here</div>

  <h2>Scene</h2>
  <div id="scene"></div>

  <h2>Layers <span class="hint">top of list = in front</span></h2>
  <div id="list"></div>

  <p class="version">console v1</p>
</aside>

<script src="js/collage.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/console.js"></script>
</body>
</html>

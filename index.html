<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collage">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Collage</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<div id="galleryView">
  <div id="galleryWrap">
    <h1>Collages</h1>
    <div id="galleryMsg"></div>
    <button id="newCollage" type="button">+ New collage</button>
    <div id="galleryList"></div>
  </div>
</div>

<div id="viewerView" class="gone">
  <div id="scroller"><div id="spacer"></div></div>
  <canvas id="canvas"></canvas>
  <div id="status"></div>
  <div id="hint">Drag or scroll to explore</div>
  <a id="galleryLink" class="gone" href="/" title="All collages">All collages</a>
  <button id="tiltBtn" class="gone" type="button">Enable tilt</button>
  <div id="version">v10</div>

  <button id="shareBtn" class="gone" type="button" aria-label="Share" title="Share">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line>
      <line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line>
    </svg>
  </button>
  <div id="shareMenu" class="hidden">
    <button id="shareReadOnly" type="button">Copy read-only link</button>
    <button id="shareCollab" class="gone" type="button">Copy collaborate link</button>
  </div>

  <button id="editFab" class="gone" type="button" aria-label="Edit" title="Edit">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
    </svg>
  </button>

  <aside id="panel" class="hidden">
    <button id="closePanel" type="button" aria-label="Close editor">Close</button>
    <div id="msg"></div>

    <h2>Add images</h2>
    <label id="drop" for="file">Tap or drop images here<br><span class="hint">PNG, JPEG, HEIC, GIF</span></label>
    <input id="file" class="sr" type="file" accept="image/*" multiple>
    <input id="pasteZone" type="text" placeholder="Tap here to paste stickers">

    <h2>Scene</h2>
    <div id="scene"></div>

    <h2>Layers <span style="font-weight:400;color:var(--muted);">-- top of list is in front</span></h2>
    <div id="list"></div>

    <p class="version">editor v1</p>
  </aside>
</div>

<script src="js/collage.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/gallery.js"></script>
<script src="js/editor.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
